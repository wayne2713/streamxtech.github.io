<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayneTV - Live Matches</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #09090e;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h1 {
            color: #ff3b3b;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .stream-card {
            margin-bottom: 25px;
            background: #14141c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .card-header {
            padding: 12px 15px;
            background: #181822;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h3 {
            margin: 0;
            color: #fff;
            font-size: 15px;
        }
        .badge-live {
            background-color: #ff3b3b;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .language-bar {
            background: #12121a;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .language-select {
            background: #1f1f2b;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            width: 100%;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>WayneTV</h1>

    <!-- 1. Barcelona vs Athletic Club (Multi-Language) -->
    <div class="stream-card">
        <div class="card-header">
            <h3>Barcelona vs Athletic Club</h3>
            <span class="badge-live">LIVE</span>
        </div>
        
        <div class="language-bar">
            <select class="language-select" onchange="changeLanguage(this, 'barca-stream')">
                <option value="https://cdx-08192.website/play/espn2-usa">English (ESPN2 USA)</option>
                <option value="https://cdx-08192.website/play/daznlaliga-es">Spanish (DAZN LaLiga)</option>
            </select>
        </div>

        <div class="video-container">
            <iframe id="barca-stream" src="https://cdx-08192.website/play/espn2-usa" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <!-- 2. Chelsea vs Luton -->
    <div class="stream-card">
        <div class="card-header">
            <h3>Chelsea vs Luton</h3>
            <span class="badge-live">LIVE</span>
        </div>
        <div class="video-container">
            <iframe src="https://cdx-08192.website/embed/skysportsmainevent-uk" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <!-- 3. Tottenham Match -->
    <div class="stream-card">
        <div class="card-header">
            <h3>Tottenham Match</h3>
            <span class="badge-live">LIVE</span>
        </div>
        <div class="video-container">
            <iframe src="https://dlstreams.st/plus/stream-53.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function changeLanguage(selectElement, iframeId) {
            const selectedUrl = selectElement.value;
            const iframe = document.getElementById(iframeId);
            iframe.src = selectedUrl;
        }
    </script>

</body>
</html>
