<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayneTV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #09090e;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h1 {
            color: #ff3b3b;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .stream-card {
            margin-bottom: 25px;
            background: #14141c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .card-header {
            padding: 12px 15px;
            background: #181822;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h3 {
            margin: 0;
            color: #fff;
            font-size: 15px;
        }
        .language-bar {
            background: #12121a;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .language-select {
            background: #1f1f2b;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            width: 100%;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>WayneTV</h1>

    <!-- Real Madrid vs Real Sociedad (Multi-Language) -->
    <div class="stream-card">
        <div class="card-header">
            <h3>Real Madrid vs Real Sociedad</h3>
            <span style="background: #ff3b3b; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold;">LIVE</span>
        </div>
        
        <!-- Language Switcher Dropdown -->
        <div class="language-bar">
            <select class="language-select" onchange="changeLanguage(this)">
                <option value="https://cdx-08192.website/embed/premiersports1-ie">English (Premier Sports 1)</option>
                <option value="https://cdx-08192.website/embed/movistarlaliga-es">Spanish (Movistar LaLiga)</option>
            </select>
        </div>

        <!-- Video Player Frame -->
        <div class="video-container">
            <iframe id="active-stream" src="https://cdx-08192.website/embed/premiersports1-ie" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function changeLanguage(selectElement) {
            const selectedUrl = selectElement.value;
            const iframe = document.getElementById('active-stream');
            
            // Instantly updates the iframe source when a different language is selected
            iframe.src = selectedUrl;
        }
    </script>

</body>
</html>
