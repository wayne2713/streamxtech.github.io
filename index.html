<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayneTV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #09090e;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h1 {
            color: #ff3b3b;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .stream-card {
            margin-bottom: 25px;
            background: #14141c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        .card-header {
            padding: 12px 15px;
            background: #181822;
        }
        .card-header h3 {
            margin: 0;
            color: #fff;
            font-size: 15px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>WayneTV</h1>

    <!-- Real Madrid vs Real Sociedad -->
    <div class="stream-card">
        <div class="card-header">
            <h3>Real Madrid vs Real Sociedad</h3>
        </div>
        <div class="video-container">
            <iframe src="https://cdx-08192.website/embed/premiersports1-ie" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Laliga Spanish -->
    <div class="stream-card">
        <div class="card-header">
            <h3>Laliga Spanish</h3>
        </div>
        <div class="video-container">
            <iframe src="https://cdx-08192.website/embed/daznlaliga-es" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
