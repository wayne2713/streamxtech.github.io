<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamX TV - Live Streams</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #09090e 0%, #12121a 50%, #0d0e15 100%);
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        header {
            background-color: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 {
            color: #ff3b3b;
            margin: 0;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(255, 59, 59, 0.4);
        }
        .container {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
        }
        p {
            color: #9aa0a6;
            padding: 0 5px;
        }
        .stream-card {
            margin-bottom: 20px;
            background: rgba(20, 20, 28, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .stream-card h3 {
            margin: 0 0 10px 0;
            color: #fff;
            font-size: 16px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }
        .nav-item {
            color: #888;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
        }
        .nav-item.active {
            color: #ff3b3b;
        }
        .nav-item div {
            font-size: 18px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>LiveX TV</h1>
    </header>

    <div class="container">
        <p>Watch your live streams below:</p>

      

        <!-- Stream 2: ABC USA -->
        <div class="stream-card">
            <h3>📺 ABC USA Live</h3>
            <div class="video-container">
                <iframe src="https://cdx-08192.website/embed/abc-usa" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Stream 3: beIN Sports 1 (Arabic) -->
        <div class="stream-card">
            <h3>⚽ beIN Sports 1 (Arabic)</h3>
            <div class="video-container">
                <iframe src="https://cdx-08192.website/play/beinsports1-sa" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Stream 4: DAZN LaLiga (Spanish) -->
        <div class="stream-card">
            <h3>⚽ DAZN LaLiga (Spanish)</h3>
            <div class="video-container">
                <iframe src="https://cdx-08192.website/play/daznlaliga-es" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Stream 5: Telemundo USA -->
        <div class="stream-card">
            <h3>📺 Telemundo USA Live</h3>
            <div class="video-container">
                <iframe src="https://cdx-08192.website/embed/telemundo-usa" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <a class="nav-item active">
            <div>🏠</div>
            Home
        </a>
        <a class="nav-item">
            <div>📡</div>
            Live
        </a>
        <a class="nav-item">
            <div>⭐</div>
            Favorites
        </a>
    </div>

</body>
</html>
