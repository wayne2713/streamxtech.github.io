<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamX Tech - Live Streaming</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff9900;
        }
        .video-container {
            position: relative;
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>🔒 My Private Stream</h1>
    <p>This is my private streaming website.</p>

    <!-- YOUR EMBED STREAM -->
    <div class="video-container">
        <iframe title="Brentford vs Tottenham Hotspur Player" marginheight="0" marginwidth="0" src="https://embed.st/embed/admin/ppv-brentford-vs-tottenham-hotspur/5" scrolling="no" allowfullscreen="yes" allow="encrypted-media; picture-in-picture;" width="100%" height="100%" frameborder="0"></iframe>
    </div>

</body>
</html>
